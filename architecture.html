<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Architecture — BBaert Photography</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-category="architecture">
    <header class="site-header">
      <div class="nav-wrap">
        <a class="brand" href="index.html">BBaert Photography</a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="portfolio.html">Portfolio</a>
          <a href="street.html">Street</a>
          <a href="nature.html">Nature</a>
          <a href="studio.html">Studio</a>
        </nav>
      </div>
    </header>

    <main>
      <section id="portfolio" class="section portfolio">
        <div class="section-header">
          <h2>Architecture</h2>
          <p>Selected architectural imagery from the portfolio.</p>
        </div>

        <div class="filter-buttons" role="tablist" aria-label="Portfolio category filter">
          <button class="filter-button" data-filter="architecture" type="button">Architecture</button>
          <button class="filter-button" data-filter="street" type="button">Street</button>
          <button class="filter-button" data-filter="nature" type="button">Nature</button>
          <button class="filter-button" data-filter="studio" type="button">Studio</button>
        </div>

        <div class="gallery-grid"></div>
      </section>

      <div class="lightbox" aria-hidden="true">
        <div class="lightbox-backdrop"></div>
        <div class="lightbox-panel" role="dialog" aria-modal="true" aria-label="Image preview">
          <button class="lightbox-close" type="button" aria-label="Close image view">×</button>
          <button class="lightbox-nav lightbox-prev" type="button" aria-label="Previous image">‹</button>
          <button class="lightbox-nav lightbox-next" type="button" aria-label="Next image">›</button>
          <img class="lightbox-image" src="" alt="" />
        </div>
      </div>
    </main>

    <footer class="footer">
      <p><a href="index.html">Back to home</a></p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
